name: Arcade Intelligence — public badge discovery

on:
  schedule:
    # Daily at 07:37 UTC (13:07 India Standard Time).
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-intelligence-data-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out agent repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check -r agent/requirements.txt

      - name: Run existing and review-system tests
        run: python -m unittest discover -s tests -v

      - name: Install OCR engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Discover public Google Skills badge pages and images using OCR
        env:
          ARCADE_MAX_PAGES: '60'
          ARCADE_MAX_IMAGES: '24'
        run: python agent/discover.py

      - name: Rebuild discovery feed
        run: python agent/public_feed.py

      - name: Build owner-review queue and approved-only database
        run: python agent/review_queue.py --bootstrap-if-needed

      - name: Publish catalogue, discovery feed and review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-data/catalogue.json \
                  agent-data/state.json \
                  agent-data/last-run.json \
                  agent-data/public-feed.json \
                  agent-data/approved-knowledge.json \
                  agent-data/review-queue.json
          if git diff --cached --quiet; then
            echo "No discovery or review-queue changes to commit."
          else
            git commit -m "chore: refresh Arcade discoveries and review queue"
            git push
          fi
