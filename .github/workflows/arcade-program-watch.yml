name: Arcade Intelligence — programme watcher

on:
  # Runs twice an hour away from the top of the hour to reduce scheduling contention.
  # GitHub Actions may still delay scheduled jobs; this is not a real-time guarantee.
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-intelligence-program-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Install agent requirements
        run: python -m pip install --disable-pip-version-check -r agent/requirements.txt

      - name: Compile agent and test modules
        run: python -m compileall -q agent tests

      - name: Validate repository JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("agent-data").glob("*.json"))
          if not files:
              raise SystemExit("No agent-data JSON files were found.")
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Valid JSON: {path}")
          PY

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Monitor Google Cloud Community announcements
        run: python agent/program_watch.py

      - name: Monitor configured YouTube channels through public Atom feeds
        run: python agent/youtube_monitor.py

      - name: Merge observations and evaluate evidence
        id: evidence
        run: python agent/evidence_engine.py

      - name: Build read-only public feed for Arcade Journey Tracker
        run: python agent/public_feed.py

      - name: Publish watcher data
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-data/community-observations.json \
                  agent-data/youtube-observations.json \
                  agent-data/program-events.json \
                  agent-data/public-feed.json \
                  agent-data/watcher-state.json \
                  agent-data/notification-state.json
          if git diff --cached --quiet; then
            echo "No programme-watcher data changes to commit."
          else
            git commit -m "chore: refresh Arcade programme intelligence"
            git push
          fi
