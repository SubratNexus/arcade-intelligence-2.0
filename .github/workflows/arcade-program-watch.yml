name: Arcade Intelligence — programme watcher

on:
  # Public forum watcher; GitHub may delay scheduled runs.
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-intelligence-data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Install agent requirements
        run: python -m pip install --disable-pip-version-check -r agent/requirements.txt

      - name: Compile agent and test modules
        run: python -m compileall -q agent tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Monitor Google Cloud Community announcements
        run: python agent/program_watch.py

      - name: Monitor configured YouTube channels through public Atom feeds
        run: python agent/youtube_monitor.py

      - name: Merge observations and evaluate evidence
        id: evidence
        run: python agent/evidence_engine.py

      - name: Build read-only discovery feed
        run: python agent/public_feed.py

      - name: Build owner-review queue and approved-only database
        id: review_queue
        run: python agent/review_queue.py --bootstrap-if-needed

      - name: Publish watcher data and review candidates
        if: ${{ always() && steps.evidence.outcome == 'success' && steps.review_queue.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-data/community-observations.json \
                  agent-data/youtube-observations.json \
                  agent-data/program-events.json \
                  agent-data/public-feed.json \
                  agent-data/watcher-state.json \
                  agent-data/notification-state.json \
                  agent-data/approved-knowledge.json \
                  agent-data/review-queue.json
          if git diff --cached --quiet; then
            echo "No programme-watcher or review-queue changes to commit."
          else
            git commit -m "chore: refresh programme discoveries and review queue"
            git push
          fi
